<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>글램독 양양 추가요금 결제 (데모)</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --bg:#F6F5F1;--surface:#FFFFFF;--surface-2:#FAF9F6;--surface-3:#EEECE6;--line:#E4E1D9;--line-2:#EFEDE7;
  --ink:#17201B;--ink-2:#545E57;--ink-3:#646B66;--ink-4:#A9AEA9;
  --brand:#1F5A36;--brand-press:#184A2C;--brand-soft:#E4EFE7;--brand-ink:#1F5A36;--on-brand:#FFFFFF;
  --ok:#2E8549;--ok-soft:#E3F1E7;--ok-ink:#22673A;
  --warn:#A8650B;--warn-soft:#FCF1DE;--warn-ink:#8F4E07;
  --bad:#C2402F;--bad-soft:#FBE9E6;--bad-ink:#A3301F;
  --info:#2A5DB0;--info-soft:#E7EEF9;--info-ink:#244F96;
  --r-lg:18px;--sh-1:0 1px 2px rgb(23 32 27/.05);--sh-3:0 16px 40px rgb(23 32 27/.18);
  --ease:cubic-bezier(.2,.8,.2,1);--out:#E7E4DC;--px:16px;
}
@media (max-width:380px){:root{--px:12px}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--out);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word;overflow-x:hidden}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.n{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);box-shadow:0 0 0 1px var(--line),0 12px 48px rgb(23 32 27/.10)}
@media (max-width:480px){body{background:var(--bg)}.app{box-shadow:none}}
.demo{display:flex;align-items:center;justify-content:center;gap:6px;min-height:28px;padding:4px var(--px);background:var(--info-soft);color:var(--info-ink);font-size:12px;font-weight:700;text-align:center}
.demo svg{width:14px;height:14px}
.hd{position:sticky;top:0;z-index:30;background:rgb(246 245 241/.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px;height:56px;padding:0 var(--px)}
.logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;min-width:0}
.logo .m{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex-shrink:0}
.logo .m svg{width:17px;height:17px}
.logo .t{font-size:12px;font-weight:750;color:var(--brand-ink);background:var(--brand-soft);border-radius:7px;padding:2px 7px;letter-spacing:0}
main{padding:0 var(--px) 120px}
.h1{font-size:21px;font-weight:800;letter-spacing:-.03em;margin:18px 0 10px;line-height:1.35}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:16px}
.card + .card{margin-top:10px}
.ct{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px;margin-bottom:10px}
.ct svg{width:17px;height:17px;color:var(--ink-3)}
.guest{display:flex;align-items:center;gap:12px;margin-top:14px}
.gi{width:46px;height:46px;border-radius:14px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex-shrink:0}
.gi svg{width:22px;height:22px}
.guest b{display:block;font-size:17px;font-weight:800}
.guest .gt span{display:block;font-size:13.5px;color:var(--ink-2)}
.from{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--ink-3);margin-top:10px}
.from svg{width:15px;height:15px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-size:15px}
.ln span{display:flex;align-items:center;gap:8px;color:var(--ink-2);min-width:0}
.ln span svg{width:17px;height:17px;color:var(--ink-3)}
.ln b{font-weight:750;white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-weight:800}
.tot b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.pays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pm{position:relative;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:750;font-size:14.5px;cursor:pointer;white-space:nowrap;min-width:0}
.pm input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.pm.on{border:2px solid var(--brand);padding:0 11px;background:var(--brand-soft)}
.pm:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.pl{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:900;flex-shrink:0}
.pl svg{width:17px;height:17px}
.pl.cc{background:var(--surface-3);color:var(--ink-2)}
.pl.kakao{background:#FEE500;color:#191919}
.pl.naver{background:#03C75A;color:#fff}
.pl.toss{background:#0064FF;color:#fff}
.opn{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);font-size:13px;color:var(--ink-2)}
.opn svg{width:17px;height:17px;color:var(--ink-3);margin-top:1px}
.opn b{display:block;font-size:12.5px;font-weight:800;color:var(--ink-3)}
.btn{min-height:48px;padding:0 16px;border-radius:13px;font-weight:750;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.btn:hover{border-color:var(--ink-4)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-press)}
.btn.big{min-height:52px;font-size:16px;border-radius:14px}
.btn.full{width:100%}
.btn svg{width:17px;height:17px}
.done-h{text-align:center;padding:30px 0 16px}
.okc{width:68px;height:68px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}
.okc svg{width:36px;height:36px;stroke-width:2.6}
.done-h h1{font-size:23px;font-weight:800;letter-spacing:-.03em}
.done-h p{font-size:14.5px;color:var(--ink-2);margin:4px 0 14px}
.okbox{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border-radius:16px;background:var(--ok-soft);color:var(--ok-ink)}
.okbox svg{width:20px;height:20px;margin-top:1px}
.okbox b{display:block;font-size:14.5px;font-weight:800}
.okbox span{display:block;font-size:13.5px;margin-top:1px}
.kv{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px 12px;font-size:14px}
.kv dt{color:var(--ink-3);font-weight:650}
.kv dd{font-weight:700}
.card.kvc{margin-top:10px}
.note{display:flex;gap:7px;font-size:12.5px;color:var(--ink-3);margin-top:12px;align-items:flex-start}
.note svg{width:15px;height:15px;margin-top:2px}
.ga{font-size:12px;font-weight:750;color:var(--ink-3);background:var(--surface-3);border-radius:6px;padding:1px 6px;letter-spacing:0}
.bar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;z-index:40;background:rgb(255 255 255/.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px var(--px) calc(10px + env(safe-area-inset-bottom));display:flex}
.bar .btn{flex:1}
.toast{position:fixed;left:0;right:0;bottom:96px;margin:0 auto;width:max-content;max-width:min(440px,calc(100% - 32px));background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:650;z-index:70;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .22s,transform .22s var(--ease);text-align:center}
.toast.on{opacity:1;transform:none}
.scrim{position:fixed;inset:0;background:rgb(16 20 18/.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;z-index:61;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .28s var(--ease);box-shadow:var(--sh-3);outline:none;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.pg-h{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:750;color:var(--ink-3)}
.pg-h svg{width:16px;height:16px;color:var(--ok)}
.pg-amt{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:10px}
.pg-m{font-size:14px;color:var(--ink-2)}
.prog{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin:20px 0 12px}
.prog i{display:block;height:100%;width:0;background:var(--brand);border-radius:4px}
.pg-s{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:750;color:var(--ink-2);min-height:24px}
.pg-s.ok{color:var(--ok-ink)}
.pg-s svg{width:20px;height:20px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--surface-3);border-top-color:var(--brand);animation:spn .8s linear infinite;flex-shrink:0}
@keyframes spn{to{transform:rotate(360deg)}}
.rc-h{display:flex;align-items:center;gap:8px;margin:-6px -8px 10px 0}
.rc-h b{font-size:18px;font-weight:800}
.rc-h .sp{flex:1}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex-shrink:0}
.ib:hover{background:var(--surface-3)}
.ib svg{width:22px;height:22px}
.rc-amt{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);margin:12px 0 16px;padding:12px 0;font-weight:800}
.rc-amt b{font-size:22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol><symbol id="i-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /> <path d="m9 12 2 2 4-4" /></symbol><symbol id="i-credit-card" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></symbol><symbol id="i-dog" viewBox="0 0 24 24"><path d="M11.25 16.25h1.5L12 17z" /> <path d="M16 14v.5" /> <path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309" /> <path d="M8 14v.5" /> <path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5" /></symbol><symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" /></symbol><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /> <path d="M12 16v-4" /> <path d="M12 8h.01" /></symbol><symbol id="i-list-checks" viewBox="0 0 24 24"><path d="m3 17 2 2 4-4" /> <path d="m3 7 2 2 4-4" /> <path d="M13 6h8" /> <path d="M13 12h8" /> <path d="M13 18h8" /></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /> <path d="M7 11V7a5 5 0 0 1 10 0v4" /></symbol><symbol id="i-receipt" viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z" /> <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" /> <path d="M12 17.5v-11" /></symbol><symbol id="i-user-round" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5" /> <path d="M20 21a8 8 0 0 0-16 0" /></symbol><symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /> <circle cx="9" cy="7" r="4" /> <path d="M22 21v-2a4 4 0 0 0-3-3.87" /> <path d="M16 3.13a4 4 0 0 1 0 7.75" /></symbol><symbol id="i-wallet" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" /> <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" /></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></symbol></svg>
<div class="app">
  <div class="demo" role="note"><svg class="i" aria-hidden="true"><use href="#i-info"/></svg>데모 · 실제 예약·결제되지 않아요</div>
  <header class="hd"><div class="hrow"><div class="logo"><span class="m"><svg class="i" aria-hidden="true"><use href="#i-dog"/></svg></span>글램독 양양<span class="t">추가요금 결제</span></div></div></header>
  <main id="main"></main>
</div>
<div class="bar" id="bar"><button class="btn pri big" id="payBtn" onclick="payNow()"></button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim" onclick="closeRc()"></div>
<div class="sheet" id="pg" role="dialog" aria-modal="true" aria-label="결제 진행" tabindex="-1">
  <div class="grab"></div>
  <div class="pg-h"><svg class="i" aria-hidden="true"><use href="#i-lock"/></svg>안전 결제 · 데모</div>
  <div class="pg-amt n" id="pgAmt"></div>
  <div class="pg-m" id="pgM"></div>
  <div class="prog"><i id="pgBar"></i></div>
  <div class="pg-s" id="pgS" aria-live="polite"></div>
</div>
<div class="sheet" id="rc" role="dialog" aria-modal="true" aria-label="영수증" tabindex="-1">
  <div class="grab"></div>
  <div class="rc-h"><b>영수증</b><span class="ga">데모</span><span class="sp"></span><button class="ib" id="rcX" onclick="closeRc()" aria-label="영수증 닫기"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <dl class="kv" id="rcBody"></dl>
  <div class="rc-amt"><span>결제 금액</span><b class="n" id="rcAmt"></b></div>
  <button class="btn pri big full" id="rcClose" onclick="closeRc()">닫기</button>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const ic = id => `<svg class="i" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => Math.round(n).toLocaleString('ko-KR');
const PAYS = [['card','신용카드','<span class="pl cc">' + ic('credit-card') + '</span>'], ['kakao','카카오페이','<span class="pl kakao">K</span>'], ['naver','네이버페이','<span class="pl naver">N</span>'], ['toss','토스페이','<span class="pl toss">T</span>']];

/* 결제할 내용 (가상) · ?amt=숫자 면 한 줄로 */
let ITEMS = [['추가 인원 1명 × 1박', 20000, 'users', '추가 인원'], ['바베큐 (야외 2번)', 30000, 'flame', '바베큐']];
const AMT = parseInt(String(new URLSearchParams(location.search).get('amt') || '').replace(/[^\d]/g, ''), 10);
if (AMT >= 100 && AMT <= 10000000) ITEMS = [['추가요금', AMT, 'receipt', '추가요금']];
const TOTAL = ITEMS.reduce((s, x) => s + x[1], 0);
const P = {pay:'card', done:false, paying:false, time:'', no:''};
const payName = () => PAYS.find(p => p[0] === P.pay)[1];
const opNote = `<div class="opn">${ic('info')}<div><b>운영자 참고</b><span>현금·계좌이체 대신 이 화면으로 받으면 현장기록과 정산이 자동으로 맞춰져요.</span></div></div>`;

function vForm() {
  return `<section class="card guest"><span class="gi">${ic('user-round')}</span><div class="gt"><b>김*연님</b><span>테라스형 203 · 10/27 입실 · 1박</span></div></section>
  <p class="from">${ic('info')}<span>양양점 프런트에서 보낸 결제 요청이에요</span></p>
  <h1 class="h1">추가요금을 결제해 주세요</h1>
  <section class="card">${ITEMS.map(([n, a, i]) => `<div class="ln"><span>${ic(i)}${esc(n)}</span><b class="n">${won(a)}원</b></div>`).join('')}
    <div class="tot"><span>합계</span><b class="n">${won(TOTAL)}원</b></div></section>
  <section class="card"><div class="ct">${ic('wallet')}결제 수단</div><div class="pays" role="radiogroup" aria-label="결제 수단">${PAYS.map(([k, n, m]) => `<label class="pm${P.pay === k ? ' on' : ''}"><input type="radio" name="pay" id="pay-${k}" value="${k}" ${P.pay === k ? 'checked' : ''} onchange="P.pay='${k}';render()">${m}<span>${n}</span></label>`).join('')}</div></section>
  ${opNote}`;
}
function vDone() {
  const rec = P.pay === 'card' ? '카드' : payName();
  return `<div class="done-h"><span class="okc">${ic('check')}</span><h1>결제 완료</h1><p class="n">${won(TOTAL)}원 · ${payName()} · ${P.time}</p>
    <button class="btn" id="rcBtn" onclick="openRc()">${ic('receipt')}영수증 보기</button></div>
  <div class="okbox">${ic('list-checks')}<div><b>현장 직원 화면에 바로 반영됐어요</b><span>현장기록: ${rec} ${won(TOTAL)}원</span></div></div>
  <section class="card kvc"><dl class="kv"><dt>객실</dt><dd>테라스형 203</dd><dt>입실</dt><dd>10/27(화) · 1박</dd>${ITEMS.map(([n, a, i, l]) => `<dt>${esc(l)}</dt><dd class="n">${won(a)}원</dd>`).join('')}</dl></section>
  <p class="note">${ic('info')}<span>프런트에 다시 들르지 않아도 돼요. 이 창은 닫아도 괜찮아요.</span></p>
  ${opNote}`;
}
function render() {
  const fid = document.activeElement && document.activeElement.id;
  $('#main').innerHTML = P.done ? vDone() : vForm();
  $('#bar').hidden = P.done;
  $('#payBtn').textContent = won(TOTAL) + '원 결제하기';
  if (fid) { const el = document.getElementById(fid); if (el && el !== document.activeElement) el.focus({preventScroll:true}); }
}
function kstNow() { const d = new Date(Date.now() + 9 * 3600e3).toISOString(); return d.slice(0, 10).replace(/-/g, '.') + ' ' + d.slice(11, 16); }
function payNow() {
  if (P.paying || P.done) return;
  P.paying = true;
  $('#pgAmt').textContent = won(TOTAL) + '원';
  $('#pgM').textContent = payName() + ' · 글램독 양양';
  const st = $('#pgS'); st.className = 'pg-s'; st.innerHTML = '<span class="spin"></span>결제를 확인하고 있어요';
  const bar = $('#pgBar'); bar.style.transition = 'none'; bar.style.width = '0';
  $('#scrim').classList.add('on'); const pg = $('#pg'); pg.classList.add('on'); pg.focus({preventScroll:true});
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = 'width 1.1s linear'; bar.style.width = '100%'; }));
  setTimeout(() => { st.className = 'pg-s ok'; st.innerHTML = ic('circle-check') + '결제가 끝났어요'; }, 1150);
  setTimeout(() => {
    $('#scrim').classList.remove('on'); pg.classList.remove('on');
    P.paying = false; P.done = true; P.time = kstNow(); P.no = String(30000000 + Math.floor(Math.random() * 9000000));
    render(); window.scrollTo(0, 0);
  }, 1650);
}
let lastF = null;
function openRc() {
  const card = P.pay === 'card';
  $('#rcBody').innerHTML = `<dt>가맹점</dt><dd>글램독 양양</dd><dt>결제 일시</dt><dd class="n">${P.time}</dd><dt>결제 수단</dt><dd>${payName()}${card ? ' · 일시불' : ''}</dd><dt>승인번호</dt><dd class="n">${P.no}</dd><dt>내용</dt><dd>${ITEMS.map(x => esc(x[0])).join(', ')}</dd>`;
  $('#rcAmt').textContent = won(TOTAL) + '원';
  lastF = document.activeElement;
  $('#scrim').classList.add('on'); const rc = $('#rc'); rc.classList.add('on'); rc.focus({preventScroll:true});
}
function closeRc() {
  if (P.paying) return;
  const rc = $('#rc'); if (!rc.classList.contains('on')) return;
  rc.classList.remove('on'); $('#scrim').classList.remove('on');
  if (lastF && lastF.focus) lastF.focus({preventScroll:true});
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeRc(); });
let tt;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2400); }
render();
</script>
</body>
</html>
